<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVT Platform - Integrated Vedic Therapy</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --sacred-gold: #d4af37;
            --deep-maroon: #6b1a1a;
            --ancient-bronze: #8b6f47;
            --spiritual-saffron: #ff9933;
            --pure-white: #fff8f0;
            --earth-brown: #3a2920;
            --sandalwood: #e8dcc4;
            --om-orange: #ff7722;
            --lotus-pink: #ffc0cb;
            --vedic-violet: #8b4789;
            --chakra-indigo: #4b0082;
        }
        
        body {
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(135deg, var(--pure-white) 0%, var(--sandalwood) 100%);
            color: var(--earth-brown);
            overflow-x: hidden;
        }
        
        #root {
            min-height: 100vh;
        }
        
        /* Animated background pattern */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }
        
        .app-container::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 153, 51, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, var(--deep-maroon) 0%, var(--earth-brown) 100%);
            color: var(--pure-white);
            padding: 2rem 1.5rem;
            box-shadow: 8px 0 32px rgba(0, 0, 0, 0.2);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            border-right: 3px solid var(--sacred-gold);
        }
        
        .logo-section {
            text-align: center;
            padding-bottom: 2rem;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 2rem;
        }
        
        .om-symbol {
            font-size: 3.5rem;
            color: var(--sacred-gold);
            margin-bottom: 0.5rem;
            animation: float 6s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        
        .logo-title {
            font-family: 'Philosopher', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--sacred-gold);
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
        }
        
        .logo-subtitle {
            font-size: 0.9rem;
            color: var(--sandalwood);
            font-style: italic;
            letter-spacing: 1px;
        }
        
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        
        .nav-item {
            padding: 1rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.1rem;
        }
        
        .nav-item:hover {
            background: rgba(212, 175, 55, 0.15);
            border-left-color: var(--sacred-gold);
            transform: translateX(8px);
        }
        
        .nav-item.active {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.25), rgba(212, 175, 55, 0.1));
            border-left-color: var(--sacred-gold);
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        
        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Main content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 3rem;
            position: relative;
            z-index: 1;
        }
        
        /* Dashboard */
        .dashboard-header {
            margin-bottom: 3rem;
            animation: slideDown 0.6s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .dashboard-title {
            font-family: 'Philosopher', sans-serif;
            font-size: 3rem;
            color: var(--deep-maroon);
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .dashboard-subtitle {
            font-size: 1.2rem;
            color: var(--ancient-bronze);
            font-style: italic;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .stat-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-top: 5px solid var(--sacred-gold);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1), transparent);
            border-radius: 50%;
            transform: translate(30%, -30%);
        }
        
        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.15);
        }
        
        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--deep-maroon);
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            font-size: 1.1rem;
            color: var(--ancient-bronze);
        }
        
        /* Assessment */
        .assessment-container {
            max-width: 1000px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease-out;
        }
        
        .progress-section {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
        
        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: var(--sandalwood);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
            position: relative;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--spiritual-saffron), var(--sacred-gold));
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }
        
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            color: var(--ancient-bronze);
        }
        
        .assessment-card {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-left: 6px solid var(--sacred-gold);
        }
        
        .section-title {
            font-family: 'Philosopher', sans-serif;
            font-size: 2.2rem;
            color: var(--deep-maroon);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .section-desc {
            font-size: 1.1rem;
            color: var(--ancient-bronze);
            margin-bottom: 2rem;
            font-style: italic;
        }
        
        .question-block {
            margin-bottom: 2.5rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(255, 248, 240, 0.5), rgba(232, 220, 196, 0.3));
            border-radius: 12px;
            border-left: 4px solid var(--spiritual-saffron);
        }
        
        .question-text {
            font-size: 1.2rem;
            color: var(--earth-brown);
            margin-bottom: 1rem;
            font-weight: 500;
        }
        
        .scale-legend {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding: 1rem;
            background: white;
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--ancient-bronze);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .response-options {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .response-btn {
            flex: 1;
            min-width: 80px;
            padding: 1.2rem;
            background: white;
            border: 3px solid var(--sandalwood);
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--earth-brown);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cormorant Garamond', serif;
        }
        
        .response-btn:hover {
            border-color: var(--sacred-gold);
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(212, 175, 55, 0.2);
        }
        
        .response-btn.selected {
            background: linear-gradient(135deg, var(--sacred-gold), var(--spiritual-saffron));
            border-color: var(--sacred-gold);
            color: white;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
        }
        
        /* Prakriti specific styles */
        .prakriti-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .prakriti-btn {
            padding: 1.5rem;
            background: white;
            border: 3px solid var(--sandalwood);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .prakriti-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
        }
        
        .prakriti-btn.vata {
            border-color: #b8d4f1;
        }
        
        .prakriti-btn.vata:hover,
        .prakriti-btn.vata.selected {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border-color: #64b5f6;
        }
        
        .prakriti-btn.pitta {
            border-color: #ffccbc;
        }
        
        .prakriti-btn.pitta:hover,
        .prakriti-btn.pitta.selected {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            border-color: #ff9800;
        }
        
        .prakriti-btn.kapha {
            border-color: #c8e6c9;
        }
        
        .prakriti-btn.kapha:hover,
        .prakriti-btn.kapha.selected {
            background: linear-gradient(135deg, #f1f8e9, #dcedc8);
            border-color: #66bb6a;
        }
        
        .dosha-label {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .dosha-desc {
            font-size: 1rem;
            color: var(--ancient-bronze);
            line-height: 1.6;
        }
        
        /* Form elements */
        .form-field {
            margin-bottom: 2rem;
        }
        
        .form-label {
            display: block;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--earth-brown);
            margin-bottom: 0.8rem;
        }
        
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 1.2rem;
            border: 2px solid var(--sandalwood);
            border-radius: 12px;
            font-size: 1.1rem;
            font-family: 'Cormorant Garamond', serif;
            background: white;
            color: var(--earth-brown);
            transition: all 0.3s ease;
        }
        
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--sacred-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }
        
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .checkbox-label:hover {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--sacred-gold);
        }
        
        .checkbox-input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--sacred-gold);
        }
        
        /* Hardware connection */
        .hardware-panel {
            background: linear-gradient(135deg, #1a237e, #283593);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3);
        }
        
        .hardware-icon {
            font-size: 5rem;
            margin-bottom: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .hardware-title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        .biosignal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        
        .biosignal-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            color: var(--earth-brown);
        }
        
        .signal-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            color: var(--deep-maroon);
        }
        
        .signal-data {
            text-align: center;
        }
        
        .metric-value {
            font-size: 3rem;
            font-weight: 700;
            color: var(--sacred-gold);
            margin-bottom: 0.5rem;
        }
        
        /* Buttons */
        .btn {
            padding: 1.2rem 2.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Philosopher', sans-serif;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--sacred-gold), var(--spiritual-saffron));
            color: white;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: var(--earth-brown);
            border: 2px solid var(--sacred-gold);
        }
        
        .btn-secondary:hover {
            background: var(--sacred-gold);
            color: white;
        }
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 2rem;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid var(--sandalwood);
        }
        
        /* Prescription View */
        .prescription-container {
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease-out;
        }
        
        .prescription-header {
            background: linear-gradient(135deg, var(--deep-maroon), var(--earth-brown));
            color: white;
            padding: 3rem;
            border-radius: 20px;
            margin-bottom: 3rem;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.2);
        }
        
        .prescription-title {
            font-family: 'Philosopher', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .rx-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .rx-summary-item {
            text-align: center;
        }
        
        .rx-summary-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }
        
        .rx-summary-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--sacred-gold);
        }
        
        .rx-section {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-left: 6px solid var(--sacred-gold);
        }
        
        .rx-section-title {
            font-family: 'Philosopher', sans-serif;
            font-size: 2rem;
            color: var(--deep-maroon);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid var(--sacred-gold);
        }
        
        .practice-card {
            background: linear-gradient(135deg, rgba(255, 248, 240, 0.8), rgba(232, 220, 196, 0.4));
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            border-left: 5px solid var(--spiritual-saffron);
            transition: all 0.3s ease;
        }
        
        .practice-card:hover {
            transform: translateX(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }
        
        .practice-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--deep-maroon);
            margin-bottom: 0.8rem;
        }
        
        .practice-sanskrit {
            font-size: 1.2rem;
            font-style: italic;
            color: var(--spiritual-saffron);
            margin-bottom: 1rem;
        }
        
        .practice-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
            font-size: 1rem;
        }
        
        .practice-detail {
            padding: 0.8rem;
            background: white;
            border-radius: 8px;
        }
        
        .detail-label {
            font-weight: 600;
            color: var(--ancient-bronze);
            margin-right: 0.5rem;
        }
        
        .practice-instructions {
            margin-top: 1rem;
            padding: 1.5rem;
            background: white;
            border-radius: 10px;
            line-height: 1.8;
            font-size: 1.05rem;
        }
        
        /* Mantra card special styling */
        .mantra-card {
            background: linear-gradient(135deg, rgba(139, 71, 137, 0.1), rgba(255, 192, 203, 0.1));
            border-left-color: var(--vedic-violet);
        }
        
        .mantra-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--vedic-violet);
            text-align: center;
            padding: 1.5rem;
            background: white;
            border-radius: 10px;
            margin: 1rem 0;
            letter-spacing: 1px;
        }
        
        /* Loading state */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }
        
        .spinner {
            width: 80px;
            height: 80px;
            border: 6px solid var(--sandalwood);
            border-top-color: var(--sacred-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 2rem;
            font-size: 1.5rem;
            color: var(--ancient-bronze);
            animation: pulse 2s ease-in-out infinite;
        }
        
        /* Info boxes */
        .info-box {
            display: flex;
            gap: 1rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(255, 153, 51, 0.1), rgba(212, 175, 55, 0.1));
            border-radius: 12px;
            border-left: 5px solid var(--spiritual-saffron);
            margin: 2rem 0;
        }
        
        .info-icon {
            font-size: 2rem;
            color: var(--spiritual-saffron);
        }
        
        .info-text {
            flex: 1;
            line-height: 1.7;
            font-size: 1.05rem;
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }
            .main-content {
                margin-left: 240px;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .main-content {
                margin-left: 0;
                padding: 1.5rem;
            }
            .prakriti-options {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Sample data and constants
        const PHQ9_QUESTIONS = [
            "Little interest or pleasure in doing things",
            "Feeling down, depressed, or hopeless",
            "Trouble falling or staying asleep, or sleeping too much",
            "Feeling tired or having little energy",
            "Poor appetite or overeating",
            "Feeling bad about yourself or that you are a failure",
            "Trouble concentrating on things",
            "Moving or speaking slowly, or being fidgety or restless",
            "Thoughts that you would be better off dead or of hurting yourself"
        ];

        const GAD7_QUESTIONS = [
