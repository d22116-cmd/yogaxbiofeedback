<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panchanga + Palmistry - Complete Astrological Analysis</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --saffron: #FF9933;
      --deep-saffron: #CC6600;
      --sacred-blue: #000080;
      --lotus-pink: #FF69B4;
      --sandalwood: #C19A6B;
      --turmeric: #FDB515;
      --forest-green: #0B6623;
      --night-sky: #0A1128;
      --moon-white: #F5F5DC;
      --vermillion: #E34234;
      --gold: #D4AF37;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Crimson Text', serif;
      background: linear-gradient(135deg, var(--night-sky) 0%, #1a0033 50%, #0d0015 100%);
      color: var(--moon-white);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, white, transparent),
        radial-gradient(2px 2px at 60px 70px, white, transparent),
        radial-gradient(1px 1px at 50px 50px, white, transparent);
      background-size: 200px 200px;
      animation: twinkle 3s ease-in-out infinite alternate;
      opacity: 0.4;
      pointer-events: none;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }
    
    .app-container {
      position: relative;
      padding: 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      padding: 2rem 0 3rem;
      animation: fadeInDown 1s ease-out;
    }
    
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 3.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold), var(--saffron), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    
    .subtitle {
      font-family: 'Tiro Devanagari Sanskrit', serif;
      font-size: 1.5rem;
      color: var(--sandalwood);
      font-style: italic;
    }
    
    .card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      margin-bottom: 2rem;
      transition: all 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      border-color: rgba(212, 175, 55, 0.5);
    }
    
    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 1.5rem;
      text-align: center;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    
    .upload-zone {
      border: 3px dashed var(--gold);
      border-radius: 15px;
      padding: 3rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(212, 175, 55, 0.05);
    }
    
    .upload-zone:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: var(--saffron);
      transform: scale(1.02);
    }
    
    .upload-zone.dragover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--vermillion);
    }
    
    .upload-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      color: var(--gold);
    }
    
    .upload-text {
      font-size: 1.3rem;
      color: var(--moon-white);
      margin-bottom: 0.5rem;
    }
    
    .upload-hint {
      font-size: 1rem;
      color: var(--sandalwood);
      font-style: italic;
    }
    
    input[type="file"] {
      display: none;
    }
    
    .preview-container {
      margin-top: 2rem;
      text-align: center;
    }
    
    .palm-preview {
      max-width: 100%;
      max-height: 500px;
      border-radius: 15px;
      border: 3px solid var(--gold);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.3);
    }
    
    .analysis-section {
      margin-top: 2rem;
    }
    
    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    
    .analysis-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      padding: 1.5rem;
      border-left: 4px solid var(--saffron);
    }
    
    .analysis-card h3 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      font-size: 1.3rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .analysis-content {
      line-height: 1.8;
      color: var(--moon-white);
    }
    
    .prediction-timeline {
      margin-top: 2rem;
    }
    
    .timeline-item {
      position: relative;
      padding-left: 2rem;
      margin-bottom: 2rem;
      border-left: 2px solid var(--gold);
    }
    
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }
    
    .timeline-date {
      font-family: 'Cinzel', serif;
      color: var(--turmeric);
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }
    
    .timeline-event {
      color: var(--moon-white);
      line-height: 1.6;
    }
    
    button {
      background: linear-gradient(135deg, var(--saffron), var(--vermillion));
      border: none;
      border-radius: 10px;
      padding: 1rem 2rem;
      color: white;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(227, 66, 52, 0.3);
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(227, 66, 52, 0.5);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .remedy-card {
      background: linear-gradient(135deg, rgba(11, 102, 35, 0.2) 0%, rgba(212, 175, 55, 0.1) 100%);
      border: 2px solid var(--forest-green);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    
    .remedy-type {
      font-family: 'Cinzel', serif;
      color: var(--turmeric);
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    
    .remedy-details {
      color: var(--moon-white);
      line-height: 1.6;
    }
    
    .combined-insight {
      background: linear-gradient(135deg, rgba(227, 66, 52, 0.1) 0%, rgba(255, 153, 51, 0.1) 100%);
      border: 2px solid var(--vermillion);
      border-radius: 15px;
      padding: 2rem;
      margin-top: 2rem;
    }
    
    .insight-title {
      font-family: 'Cinzel', serif;
      color: var(--vermillion);
      font-size: 1.5rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    
    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid rgba(212, 175, 55, 0.3);
    }
    
    .tab {
      padding: 1rem 2rem;
      background: transparent;
      border: none;
      color: var(--sandalwood);
      font-family: 'Cinzel', serif;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 3px solid transparent;
    }
    
    .tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }
    
    .tab:hover {
      color: var(--gold);
    }
    
    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      .subtitle { font-size: 1rem; }
      .analysis-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    function IntegratedAstrologyApp() {
      const [activeTab, setActiveTab] = useState('panchanga');
      const [palmImage, setPalmImage] = useState(null);
      const [palmAnalysis, setPalmAnalysis] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [currentPanchanga, setCurrentPanchanga] = useState(null);
      const [combinedInsights, setCombinedInsights] = useState(null);
      const fileInputRef = useRef(null);
      
      useEffect(() => {
        // Load current Panchanga
        loadPanchanga();
        const interval = setInterval(loadPanchanga, 60000);
        return () => clearInterval(interval);
      }, []);
      
      const loadPanchanga = async () => {
        // Mock Panchanga data
        const now = new Date();
        setCurrentPanchanga({
          vara: { name: "Guruvara", planet: "Guru", english: "Thursday" },
          tithi: { number: 12, name: "Dwadashi", paksha: "Shukla", percentComplete: 67 },
          nakshatra: { name: "Rohini", deity: "Brahma", pada: 3 },
          yoga: { name: "Siddhi" },
          timestamp: now.toISOString()
        });
      };
      
      const handleFileSelect = (event) => {
        const file = event.target.files[0];
        if (file) {
          processImage(file);
        }
      };
      
      const handleDrop = (event) => {
        event.preventDefault();
        const file = event.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
          processImage(file);
        }
      };
      
      const processImage = (file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          setPalmImage(e.target.result);
          analyzePalm(file);
        };
        reader.readAsDataURL(file);
      };
      
      const analyzePalm = async (file) => {
        setIsAnalyzing(true);
        
        try {
          // Simulate AI analysis with Claude API
          const analysis = await performPalmAnalysis(file);
          setPalmAnalysis(analysis);
          
          // Combine with Panchanga
          if (currentPanchanga) {
            const insights = combineAnalyses(analysis, currentPanchanga);
            setCombinedInsights(insights);
          }
        } catch (error) {
          console.error('Analysis error:', error);
          alert('Error analyzing palm. Please try again.');
        } finally {
          setIsAnalyzing(false);
        }
      };
      
      const performPalmAnalysis = async (file) => {
        // Convert image to base64
        const base64 = await fileToBase64(file);
        
        // Call Claude API for palm analysis
        try {
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 3000,
              messages: [{
                role: 'user',
                content: [
                  {
                    type: 'image',
                    source: {
                      type: 'base64',
                      media_type: file.type,
                      data: base64.split(',')[1]
                    }
                  },
                  {
                    type: 'text',
                    text: `As an expert in Hasta Samudrika Shastra (Indian palmistry), analyze this palm image and provide:

1. **Personality Traits** - Character, strengths, weaknesses based on palm lines and mounts
2. **Career & Finance** - Professional aptitude, financial prospects
3. **Health Indicators** - Physical and mental health tendencies visible in the palm
4. **Relationships** - Love life, marriage prospects, family dynamics
5. **Life Path** - Major life events, spiritual inclinations
6. **Swara Yoga Recommendations** - Which pranayama practices suit this constitution

Identify visible lines:
- Hridaya Rekha (Heart Line)
- Mastishka Rekha (Head Line)
- Jivana Rekha (Life Line)
- Bhagya Rekha (Fate Line)

Also note:
- Dominant mounts (Jupiter, Saturn, Apollo, Mercury, Venus, Mars, Moon)
- Finger characteristics
- Hand shape and type

Provide practical, compassionate guidance in a structured format with Sanskrit terminology where appropriate.`
                  }
                ]
              }]
            })
          });
          
          const data = await response.json();
          const aiAnalysis = data.content[0].text;
          
          return {
            fullAnalysis: aiAnalysis,
            personality: extractSection(aiAnalysis, 'Personality'),
            career: extractSection(aiAnalysis, 'Career'),
            health: extractSection(aiAnalysis, 'Health'),
            relationships: extractSection(aiAnalysis, 'Relationships'),
            lifePath: extractSection(aiAnalysis, 'Life Path'),
            swaraRecommendations: extractSection(aiAnalysis, 'Swara Yoga'),
            timestamp: new Date().toISOString()
          };
        } catch (error) {
          console.error('AI Analysis Error:', error);
          // Return mock data if API fails
          return getMockAnalysis();
        }
      };
      
      const fileToBase64 = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      };
      
      const extractSection = (text, sectionName) => {
        const regex = new RegExp(`\\*\\*${sectionName}[^*]*\\*\\*([^*]+)`, 'i');
        const match = text.match(regex);
        return match ? match[1].trim() : 'Analysis in progress...';
      };
      
      const combineAnalyses = (palm, panchanga) => {
        return {
          currentPeriod: `You are in ${panchanga.tithi.name} Tithi (${panchanga.tithi.paksha} Paksha) under ${panchanga.nakshatra.name} Nakshatra. This period is favorable for introspection and spiritual practices.`,
          
          upcomingEvents: [
            {
              timeframe: 'Next 1-3 months',
              category: 'Career',
              prediction: 'Based on your palm lines and current Nakshatra, career opportunities may arise during Shukla Paksha',
              auspiciousTime: 'Thursday (Guruvara) during Pushya or Rohini Nakshatra'
            },
            {
              timeframe: 'Next 3-6 months',
              category: 'Personal Growth',
              prediction: 'Strong spiritual development indicated. Practice meditation during Ekadashi',
              auspiciousTime: 'During Brahma Muhurta (1.5 hours before sunrise)'
            }
          ],
          
          remedies: [
            {
              type: 'Gemstone',
              item: 'Yellow Sapphire (Pukhraj)',
              usage: 'Wear on index finger on Thursday morning during Pushya Nakshatra',
              benefit: 'Enhances wisdom, prosperity, and spiritual growth'
            },
            {
              type: 'Mantra',
              item: 'Om Gam Ganapataye Namaha',
              usage: 'Chant 108 times daily during sunrise',
              benefit: 'Removes obstacles, brings success'
            },
            {
              type: 'Swara Yoga',
              item: 'Nadi Shodhana Pranayama',
              usage: 'Practice for 15 minutes during Brahma Muhurta',
              benefit: 'Balances energy channels, enhances mental clarity'
            }
          ],
          
          auspiciousTimes: {
            spiritual: `${panchanga.vara.name} (${panchanga.vara.english}) is ruled by ${panchanga.vara.planet} - excellent for spiritual practices`,
            newVentures: 'Wait for Purnima (Full Moon) for important new beginnings',
            relationships: 'Shukravara (Friday) during Shukla Paksha is favorable',
            learning: 'Budhavara (Wednesday) during daytime for learning and communication'
          }
        };
      };
      
      const getMockAnalysis = () => {
        return {
          fullAnalysis: 'Mock palm analysis for demonstration',
          personality: 'Strong willpower, creative nature, balanced emotions indicated by clear heart and head lines.',
          career: 'Natural leadership abilities. Career in teaching, counseling, or creative fields recommended.',
          health: 'Good vitality shown by strong life line. Pay attention to stress management.',
          relationships: 'One significant relationship indicated. Harmonious partnerships likely.',
          lifePath: 'Spiritual inclination strong. Path of self-discovery and service to others.',
          swaraRecommendations: 'Practice Nadi Shodhana for balance, Bhastrika for vitality during morning hours.',
          timestamp: new Date().toISOString()
        };
      };
      
      return (
        <div className="app-container">
          <header>
            <h1>ज्योतिष सम्पूर्ण विश्लेषण</h1>
            <div className="subtitle">Jyotisha Sampoorna Vishleshan</div>
            <div className="subtitle" style={{fontSize: '1.1rem', marginTop: '0.5rem'}}>
              Panchanga + Palmistry - Complete Astrological Analysis
            </div>
          </header>
          
          <div className="tabs">
            <button 
              className={`tab ${activeTab === 'panchanga' ? 'active' : ''}`}
              onClick={() => setActiveTab('panchanga')}
            >
              पञ्चाङ्गम् Panchanga
            </button>
            <button 
              className={`tab ${activeTab === 'palmistry' ? 'active' : ''}`}
              onClick={() => setActiveTab('palmistry')}
            >
              हस्त समुद्रिक Palmistry
            </button>
            <button 
              className={`tab ${activeTab === 'combined' ? 'active' : ''}`}
              onClick={() => setActiveTab('combined')}
              disabled={!combinedInsights}
            >
              सम्मिलित Combined Insights
            </button>
          </div>
          
          {activeTab === 'panchanga' && currentPanchanga && (
            <div className="card">
              <h2 className="card-title">Current Panchanga</h2>
              <div className="analysis-grid">
                <div className="analysis-card">
                  <h3>🗓️ Vara (Day)</h3>
                  <div className="analysis-content">
                    <strong>{currentPanchanga.vara.name}</strong> ({currentPanchanga.vara.english})<br/>
                    Ruled by {currentPanchanga.vara.planet}
                  </div>
                </div>
                
                <div className="analysis-card">
                  <h3>🌙 Tithi (Lunar Day)</h3>
                  <div className="analysis-content">
                    <strong>{currentPanchanga.tithi.name}</strong><br/>
                    {currentPanchanga.tithi.paksha} Paksha<br/>
                    {currentPanchanga.tithi.percentComplete}% Complete
                  </div>
                </div>
                
                <div className="analysis-card">
                  <h3>⭐ Nakshatra</h3>
                  <div className="analysis-content">
                    <strong>{currentPanchanga.nakshatra.name}</strong><br/>
                    Deity: {currentPanchanga.nakshatra.deity}<br/>
                    Pada: {currentPanchanga.nakshatra.pada}
                  </div>
                </div>
                
                <div className="analysis-card">
                  <h3>🔮 Yoga</h3>
                  <div className="analysis-content">
                    <strong>{currentPanchanga.yoga.name}</strong><br/>
                    Auspicious for spiritual practices
                  </div>
                </div>
              </div>
            </div>
          )}
          
          {activeTab === 'palmistry' && (
            <>
              <div className="card">
                <h2 className="card-title">Upload Palm Image</h2>
                <div 
                  className="upload-zone"
                  onClick={() => fileInputRef.current?.click()}
                  onDrop={handleDrop}
                  onDragOver={(e) => e.preventDefault()}
                >
                  <div className="upload-icon">🖐️</div>
                  <div className="upload-text">Click or drag palm image here</div>
                  <div className="upload-hint">
                    Upload a clear photo of your palm (right hand for males, left hand for females)
                  </div>
                  <input 
                    ref={fileInputRef}
                    type="file" 
                    accept="image/*"
                    onChange={handleFileSelect}
                  />
                </div>
                
                {palmImage && (
                  <div className="preview-container">
                    <img src={palmImage} alt="Palm" className="palm-preview" />
                    {isAnalyzing && (
                      <div style={{marginTop: '1rem'}}>
                        <div className="loading-spinner"></div>
                        <p style={{marginTop: '1rem'}}>Analyzing palm with AI...</p>
                      </div>
                    )}
                  </div>
                )}
              </div>
              
              {palmAnalysis && (
                <div className="card">
                  <h2 className="card-title">Palm Analysis Results</h2>
                  
                  <div className="analysis-grid">
                    <div className="analysis-card">
                      <h3>👤 Personality</h3>
                      <div className="analysis-content">{palmAnalysis.personality}</div>
                    </div>
                    
                    <div className="analysis-card">
                      <h3>💼 Career & Finance</h3>
                      <div className="analysis-content">{palmAnalysis.career}</div>
                    </div>
                    
                    <div className="analysis-card">
                      <h3>❤️ Relationships</h3>
                      <div className="analysis-content">{palmAnalysis.relationships}</div>
                    </div>
                    
                    <div className="analysis-card">
                      <h3>🏥 Health</h3>
                      <div className="analysis-content">{palmAnalysis.health}</div>
                    </div>
                    
                    <div className="analysis-card">
                      <h3>🛤️ Life Path</h3>
                      <div className="analysis-content">{palmAnalysis.lifePath}</div>
                    </div>
                    
                    <div className="analysis-card">
                      <h3>🧘 Swara Yoga</h3>
                      <div className="analysis-content">{palmAnalysis.swaraRecommendations}</div>
                    </div>
                  </div>
                  
                  <div className="analysis-section">
                    <h3 style={{color: 'var(--gold)', marginBottom: '1rem'}}>Complete Analysis</h3>
                    <div style={{
                      background: 'rgba(255,255,255,0.03)',
                      padding: '1.5rem',
                      borderRadius: '10px',
                      lineHeight: '1.8',
                      whiteSpace: 'pre-wrap'
                    }}>
                      {palmAnalysis.fullAnalysis}
                    </div>
                  </div>
                </div>
              )}
            </>
          )}
          
          {activeTab === 'combined' && combinedInsights && (
            <div className="card">
              <h2 className="card-title">Combined Astrological Insights</h2>
              
              <div className="combined-insight">
                <div className="insight-title">Current Cosmic Period</div>
                <p style={{lineHeight: '1.8', textAlign: 'center'}}>
                  {combinedInsights.currentPeriod}
                </p>
              </div>
              
              <div className="analysis-section">
                <h3 style={{color: 'var(--gold)', marginBottom: '1rem'}}>Upcoming Predictions</h3>
                <div className="prediction-timeline">
                  {combinedInsights.upcomingEvents.map((event, idx) => (
                    <div key={idx} className="timeline-item">
                      <div className="timeline-date">{event.timeframe} - {event.category}</div>
                      <div className="timeline-event">
                        {event.prediction}<br/>
                        <strong>Best Time:</strong> {event.auspiciousTime}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              
              <div className="analysis-section">
                <h3 style={{color: 'var(--gold)', marginBottom: '1rem'}}>Remedies & Recommendations</h3>
                {combinedInsights.remedies.map((remedy, idx) => (
                  <div key={idx} className="remedy-card">
                    <div className="remedy-type">🔱 {remedy.type}</div>
                    <div className="remedy-details">
                      <strong>{remedy.item}</strong><br/>
                      Usage: {remedy.usage}<br/>
                      Benefit: {remedy.benefit}
                    </div>
                  </div>
                ))}
              </div>
              
              <div className="analysis-section">
                <h3 style={{color: 'var(--gold)', marginBottom: '1rem'}}>Auspicious Times</h3>
                <div className="analysis-grid">
                  <div className="analysis-card">
                    <h3>🕉️ Spiritual Practices</h3>
                    <div className="analysis-content">{combinedInsights.auspiciousTimes.spiritual}</div>
                  </div>
                  
                  <div className="analysis-card">
                    <h3>🚀 New Ventures</h3>
                    <div className="analysis-content">{combinedInsights.auspiciousTimes.newVentures}</div>
                  </div>
                  
                  <div className="analysis-card">
                    <h3>💕 Relationships</h3>
                    <div className="analysis-content">{combinedInsights.auspiciousTimes.relationships}</div>
                  </div>
                  
                  <div className="analysis-card">
                    <h3>📚 Learning</h3>
                    <div className="analysis-content">{combinedInsights.auspiciousTimes.learning}</div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<IntegratedAstrologyApp />);
  </script>
</body>
</html>
