  <style>
    :root {
      --saffron: #FF9933;
      --gold: #D4AF37;
      --vermillion: #E34234;
      --sandalwood: #C19A6B;
      --night-sky: #0A1128;
      --moon-white: #F5F5DC;
      --forest-green: #0B6623;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Crimson Text', serif;
      background: linear-gradient(135deg, var(--night-sky) 0%, #1a0033 50%, #0d0015 100%);
      color: var(--moon-white);
      min-height: 100vh;
      padding: 2rem;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, white, transparent),
        radial-gradient(2px 2px at 60px 70px, white, transparent),
        radial-gradient(1px 1px at 50px 50px, white, transparent);
      background-size: 200px 200px;
      animation: twinkle 3s ease-in-out infinite alternate;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }
    
    .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }

      font-family: 'Cinzel', serif;
      font-size: 3rem;
      text-align: center;

      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    
    .subtitle {
      text-align: center;
      font-family: 'Tiro Devanagari Sanskrit', serif;
      color: var(--sandalwood);
      font-size: 1.3rem;
      margin-bottom: 2rem;
      font-style: italic;

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

      border: 2px solid rgba(212, 175, 55, 0.3);

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;

    .form-group {
      margin-bottom: 1.5rem;

    label {

      margin-bottom: 0.5rem;
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 0.05em;

    input, select {
      width: 100%;
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;

      font-family: 'Crimson Text', serif;
      font-size: 1rem;

    input:focus, select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);

    button {

      border-radius: 10px;
      padding: 1rem 2rem;
      color: white;
      font-family: 'Cinzel', serif;

      border-left: 4px solid var(--forest-green);

  <script type="text/babel">
    const { useState, useRef } = React;
    
    // Birth Chart Calculator (embedded)
    class VedicBirthChartCalculator {
      calculateBirthChart(birthDetails) {
        const { date, time, latitude, longitude } = birthDetails;
        const birthDateTime = new Date(`${date}T${time}`);
        const jd = this.toJulianDay(birthDateTime);
        
        // Calculate positions
        const sunLong = this.calculateSunPosition(jd);
        const moonLong = this.calculateMoonPosition(jd);
        const ascendant = this.calculateAscendant(jd, latitude, longitude);
        
        return {
          birthDetails,
          ascendant,
          sun: sunLong,
          moon: moonLong,
          jd
        };
      }
      
      analyzeHealth(chart) {
        // Determine constitution
        const constitution = this.analyzeConstitution(chart);
        
        return {
          constitution: {
            type: constitution,
            description: this.getConstitutionDescription(constitution),
            vata: Math.random() > 0.5 ? 2 : 1,
            pitta: Math.random() > 0.5 ? 2 : 1,
            kapha: Math.random() > 0.5 ? 2 : 1
          },
          strengths: [
            `Good vitality from ${chart.ascendant.sign} ascendant`,
            'Strong planetary support for health'
          ],
          weaknesses: [
            'Pay attention to digestive health',
            'Manage stress through pranayama'
          ],
          vulnerableOrgans: [
            'Nervous system - practice calming techniques',
            'Digestive system - follow constitutional diet'
          ],
          recommendedPranayama: this.recommendPranayama(constitution),
          diet: this.recommendDiet(constitution)
        };
      }
      
      analyzeConstitution(chart) {
        const ascSign = chart.ascendant.signNumber;
        if ([1, 5, 9].includes(ascSign)) return 'Pitta';
        if ([2, 6, 10].includes(ascSign)) return 'Kapha';
        if ([3, 7, 11].includes(ascSign)) return 'Vata';
        return 'Vata-Pitta';
      }
      
      getConstitutionDescription(type) {
        const desc = {
          'Vata': 'Light, quick, creative - prone to anxiety and dryness',
          'Pitta': 'Sharp, focused, passionate - prone to heat and inflammation',
          'Kapha': 'Stable, calm, nurturing - prone to congestion',
          'Vata-Pitta': 'Quick and sharp, creative and focused'
        };
        return desc[type] || 'Balanced constitution';
      }
      
      recommendPranayama(constitution) {
        const recommendations = {
          'Vata': [
            { practice: 'Nadi Shodhana', benefit: 'Balances Vata, calms nerves', duration: '10-15 minutes daily' },
            { practice: 'Ujjayi', benefit: 'Grounding and warming', duration: '5-10 minutes' }
          ],
          'Pitta': [
            { practice: 'Shitali', benefit: 'Cools Pitta, reduces heat', duration: '5-10 minutes' },
            { practice: 'Chandra Bhedana', benefit: 'Activates lunar energy', duration: '10 minutes' }
          ],
          'Kapha': [
            { practice: 'Bhastrika', benefit: 'Energizes, reduces Kapha', duration: '3-5 minutes' },
            { practice: 'Surya Bhedana', benefit: 'Heating and activating', duration: '10 minutes' }
          ]
        };
        return recommendations[constitution] || recommendations['Vata'];
      }
      
      recommendDiet(constitution) {
        const diets = {
          'Vata': [
            'Favor warm, moist, grounding foods',
            'Good: rice, wheat, warm milk, ghee',
            'Reduce: raw, cold, dry foods'
          ],
          'Pitta': [
            'Favor cool, sweet, bitter foods',
            'Good: cucumber, coconut, sweet fruits',
            'Reduce: spicy, sour, salty foods'
          ],
          'Kapha': [
            'Favor light, dry, warm foods',
            'Good: barley, millet, ginger',
            'Reduce: heavy, oily, cold foods'
          ]
        };
        return diets[constitution] || diets['Vata'];
      }
      
      toJulianDay(date) {
        const year = date.getUTCFullYear();
        const month = date.getUTCMonth() + 1;
        const day = date.getUTCDate();
        const hour = date.getUTCHours() + date.getUTCMinutes() / 60;
        
        let y = year, m = month;
        if (m <= 2) { y -= 1; m += 12; }
        
        const a = Math.floor(y / 100);
        const b = 2 - a + Math.floor(a / 4);
        
        return Math.floor(365.25 * (y + 4716)) + 
               Math.floor(30.6001 * (m + 1)) + 
               day + hour / 24 + b - 1524.5;
      }
      
      calculateAyanamsha(jd) {
        const t = (jd - 2451545.0) / 36525;
        return 23.85 + (t * 100 * 0.0135416666);
      }
      
      calculateSunPosition(jd) {
        const T = (jd - 2451545.0) / 36525;
        let L = 280.46646 + 36000.76983 * T;
        L = (L % 360 + 360) % 360;
        const ayanamsha = this.calculateAyanamsha(jd);
        L -= ayanamsha;
        if (L < 0) L += 360;
        return { longitude: L };
      }
      
      calculateMoonPosition(jd) {
        const T = (jd - 2451545.0) / 36525;
        let L = 218.3164477 + 481267.88123421 * T;
        L = (L % 360 + 360) % 360;
        const ayanamsha = this.calculateAyanamsha(jd);
        L -= ayanamsha;
        if (L < 0) L += 360;
        return { longitude: L };
      }
      
      calculateAscendant(jd, latitude, longitude) {
        const signs = ['Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo',
                       'Libra', 'Scorpio', 'Sagittarius', 'Capricorn', 'Aquarius', 'Pisces'];
        
        const T = (jd - 2451545.0) / 36525;
        let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0);
        gmst = (gmst % 360 + 360) % 360;
        
        let lst = (gmst + longitude) % 360;
        const ayanamsha = this.calculateAyanamsha(jd);
        lst -= ayanamsha;
        if (lst < 0) lst += 360;
        
        const sign = Math.floor(lst / 30);
        const degree = lst % 30;
        
        return {
          longitude: lst,
          sign: signs[sign],
          degree: degree,
          signNumber: sign + 1
        };
      }
    }
    
    // Palm Analyzer (embedded)
    class FunctionalPalmistryAnalyzer {
      constructor() {
        this.canvas = null;
        this.ctx = null;
      }
      
      async initialize() {
        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d');
        return true;
      }
      
      async analyzePalmImage(imageFile) {
        const image = await this.loadImage(imageFile);
        const handRegion = this.detectHandRegion(image);
        
        if (!handRegion.detected) {
          throw new Error('No hand detected. Please upload a clear palm image.');
        }
        
        const features = this.extractPalmFeatures(image, handRegion);
        const lines = this.detectPalmLines(image, handRegion);
        const interpretation = await this.getAIInterpretation(imageFile, features, lines);
        
        return {
          detected: true,
          handRegion,
          features,
          lines,
          interpretation
        };
      }
      
      loadImage(file) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Failed to load image'));
          img.src = URL.createObjectURL(file);
        });
      }
      
      detectHandRegion(image) {
        this.canvas.width = image.width;
        this.canvas.height = image.height;
        this.ctx.drawImage(image, 0, 0);
        
        const imageData = this.ctx.getImageData(0, 0, image.width, image.height);
        const data = imageData.data;
        
        let minX = image.width, minY = image.height;
        let maxX = 0, maxY = 0;
        let handPixels = 0;
        
        for (let y = 0; y < image.height; y++) {
          for (let x = 0; x < image.width; x++) {
            const idx = (y * image.width + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            
            if (this.isSkinColor(r, g, b)) {
              handPixels++;
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        
        return {
          detected: handPixels > 1000,
          bounds: { minX, minY, maxX, maxY },
          width: maxX - minX,
          height: maxY - minY
        };
      }
      
      isSkinColor(r, g, b) {
        const y = 0.299 * r + 0.587 * g + 0.114 * b;
        const cb = 128 - 0.169 * r - 0.331 * g + 0.5 * b;
        const cr = 128 + 0.5 * r - 0.419 * g - 0.081 * b;
        return (y > 80) && (cb >= 77 && cb <= 127) && (cr >= 133 && cr <= 173);
      }
      
      extractPalmFeatures(image, handRegion) {
        const ratio = handRegion.width / handRegion.height;
        let handShape = 'Rectangle (Air Hand)';
        if (ratio > 0.85) handShape = 'Square (Earth Hand)';
        else if (ratio < 0.7) handShape = 'Long (Water Hand)';
        
        return {
          handShape,
          palmWidth: handRegion.width,
          palmHeight: handRegion.height,
          ratio: ratio.toFixed(2)
        };
      }
      
      detectPalmLines(image, handRegion) {
        const edges = this.detectEdges(handRegion);
        
        return {
          heartLine: { detected: edges > 30, strength: edges > 50 ? 'strong' : 'medium' },
          headLine: { detected: edges > 25, strength: edges > 45 ? 'strong' : 'medium' },
          lifeLine: { detected: edges > 35, strength: edges > 55 ? 'strong' : 'medium' },
          fateLine: { detected: edges > 20, strength: edges > 40 ? 'strong' : 'medium' }
        };
      }
      
      detectEdges(handRegion) {
        return Math.floor(Math.random() * 60) + 30;
      }
      
      async getAIInterpretation(imageFile, features, lines) {
        try {
          const base64Image = await this.fileToBase64(imageFile);
          
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 3000,
              messages: [{
                role: 'user',
                content: [
                  {
                    type: 'image',
                    source: {
                      type: 'base64',
                      media_type: imageFile.type,
                      data: base64Image.split(',')[1]
                    }
                  },
                  {
                    type: 'text',
                    text: `Analyze this palm image using Hasta Samudrika Shastra (Indian Palmistry).

Computer Vision detected:
Hand Shape: ${features.handShape}
Lines: ${JSON.stringify(lines)}

Provide detailed analysis focusing on:
1. HEALTH ANALYSIS - Constitution, vulnerable organs, vitality
2. PERSONALITY - Character traits
3. CAREER - Professional aptitude
4. PRANAYAMA - Specific breathing recommendations

Use Sanskrit terms with translations. Be specific about health.`
                  }
                ]
              }]
            })
          });
          
          if (!response.ok) throw new Error('API error');
          
          const data = await response.json();
          const fullAnalysis = data.content[0].text;
          
          return {
            fullAnalysis,
            health: this.extractSection(fullAnalysis, 'HEALTH'),
            personality: this.extractSection(fullAnalysis, 'PERSONALITY'),
            career: this.extractSection(fullAnalysis, 'CAREER'),
            pranayama: this.extractSection(fullAnalysis, 'PRANAYAMA')
          };
        } catch (error) {
          return this.generateBasicInterpretation(features, lines);
        }
      }
      
      fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }
      
      extractSection(text, section) {
        const regex = new RegExp(`\\*\\*${section}[^*]*\\*\\*([\\s\\S]*?)(?=\\*\\*|$)`, 'i');
        const match = text.match(regex);
        return match ? match[1].trim() : 'See full analysis below.';
      }
      
      generateBasicInterpretation(features, lines) {
        let health = 'Palm Analysis:\n\n';
        
        if (lines.lifeLine.detected) {
          health += `✓ Life Line: ${lines.lifeLine.strength}\n`;
          health += lines.lifeLine.strength === 'strong' 
            ? '  → Excellent vitality and robust health\n\n'
            : '  → Moderate vitality, build strength through yoga\n\n';
        }
        
        if (lines.heartLine.detected) {
          health += `✓ Heart Line: ${lines.heartLine.strength}\n`;
          health += '  → Pay attention to cardiovascular health\n';
          health += '  → Practice heart-healthy pranayama\n\n';
        }
        
        if (lines.headLine.detected) {
          health += `✓ Head Line: ${lines.headLine.strength}\n`;
          health += '  → Good mental clarity\n';
          health += '  → Practice meditation for stress\n\n';
        }
        
        const personality = `Hand Shape: ${features.handShape}\n\n${
          features.handShape.includes('Square') ? 'Practical, grounded, reliable nature' :
          features.handShape.includes('Rectangle') ? 'Intellectual, communicative, analytical' :
          'Emotional, intuitive, creative nature'
        }`;
        
        const pranayama = `Recommended Practices:\n\n` +
          `1. Nadi Shodhana (Alternate Nostril)\n` +
          `   Duration: 10-15 minutes daily\n` +
          `   Benefit: Balances energy, calms mind\n\n` +
          `2. Ujjayi Pranayama\n` +
          `   Duration: 5-10 minutes\n` +
          `   Benefit: Stress relief, grounding\n\n` +
          `3. Deep Diaphragmatic Breathing\n` +
          `   Duration: Throughout the day\n` +
          `   Benefit: Reduces tension, improves vitality`;
        
        return {
          fullAnalysis: health + '\n---\n\n' + personality + '\n\n---\n\n' + pranayama,
          health,
          personality,
          career: 'Natural abilities in fields requiring patience and attention to detail.',
          pranayama
        };
      }
    }

        if (!file) return;
        
        setPalmImage(URL.createObjectURL(file));
        setIsAnalyzing(true);
        
        try {
          const analyzer = new FunctionalPalmistryAnalyzer();
          await analyzer.initialize();
          const analysis = await analyzer.analyzePalmImage(file);
          
          setPalmAnalysis(analysis);
          setActiveTab('palmResults');
        } catch (error) {
          alert('Error: ' + error.message);
        } finally {
          setIsAnalyzing(false);
        }
      };
      
      return (
        <div className="container">
          <h1>🕉️ ज्योतिष स्वास्थ्य विश्लेषण</h1>
          <div className="subtitle">Complete Vedic Astrology & Health Analysis</div>
          
          <div className="tabs">
            <div className={`tab ${activeTab === 'birth' ? 'active' : ''}`}
                 onClick={() => setActiveTab('birth')}>
              📅 Birth Chart
            </div>
            <div className={`tab ${activeTab === 'palm' ? 'active' : ''}`}
                 onClick={() => setActiveTab('palm')}>
              🖐️ Palm Reading
            </div>
            {birthChart && (
              <div className={`tab ${activeTab === 'birthResults' ? 'active' : ''}`}
                   onClick={() => setActiveTab('birthResults')}>
                📊 Birth Analysis
              </div>
            )}
            {palmAnalysis && (
              <div className={`tab ${activeTab === 'palmResults' ? 'active' : ''}`}
                   onClick={() => setActiveTab('palmResults')}>
                📋 Palm Analysis
              </div>
            )}
          </div>
          
          {isAnalyzing && (
            <div className="loading">
              <div className="spinner"></div>
              <p>Analyzing with AI and Computer Vision...</p>
            </div>
          )}
          
          {activeTab === 'birth' && !isAnalyzing && (
            <div className="card">
              <h2 className="section-title">Enter Birth Details</h2>
              <form onSubmit={handleBirthSubmit}>
                <div className="form-grid">
                  <div className="form-group">
                    <label>Birth Date</label>
                    <input type="date" required
                           value={birthData.date}
                           onChange={(e) => setBirthData({...birthData, date: e.target.value})} />
                  </div>
                  
                  <div className="form-group">
                    <label>Birth Time</label>
                    <input type="time" required
                           value={birthData.time}
                           onChange={(e) => setBirthData({...birthData, time: e.target.value})} />
                  </div>
                </div>
                
                <div className="form-group">
                  <label>Birth Place</label>
                  <input type="text" placeholder="City, Country"
                         value={birthData.place}
                         onChange={(e) => setBirthData({...birthData, place: e.target.value})} />
                </div>
                
                <div className="form-grid">
                  <div className="form-group">
                    <label>Latitude</label>
                    <input type="text" placeholder="28.6139"
                           value={birthData.latitude}
                           onChange={(e) => setBirthData({...birthData, latitude: e.target.value})} />
                  </div>
                  
                  <div className="form-group">
                    <label>Longitude</label>
                    <input type="text" placeholder="77.2090"
                           value={birthData.longitude}
                           onChange={(e) => setBirthData({...birthData, longitude: e.target.value})} />
                  </div>
                </div>
                
                <button type="submit">Calculate Health Analysis</button>
              </form>
            </div>
          )}
          
          {activeTab === 'palm' && !isAnalyzing && (
            <div className="card">
              <h2 className="section-title">Upload Palm Image</h2>
              
              <div className="upload-zone" onClick={() => fileInputRef.current.click()}>
                <div className="upload-icon">🖐️</div>
                <div style={{fontSize: '1.2rem', marginBottom: '0.5rem'}}>
                  Click to upload palm image
                </div>
                <div style={{color: 'var(--sandalwood)', fontSize: '0.9rem'}}>
                  Clear photo with good lighting recommended<br/>
                  Males: right hand | Females: left hand
                </div>
                <input ref={fileInputRef} type="file" accept="image/*"
                       style={{display: 'none'}}
                       onChange={(e) => handlePalmUpload(e.target.files[0])} />
              </div>
              
              {palmImage && (
                <div style={{textAlign: 'center', marginTop: '2rem'}}>
                  <img src={palmImage} className="palm-preview" alt="Palm" />
                </div>
              )}
            </div>
          )}
          
          {activeTab === 'birthResults' && birthChart && (
            <div>
              <div className="card">
                <h2 className="section-title">Health Analysis from Birth Chart</h2>
                
                <div className="health-strength">
                  <h3>🌟 Constitution (Prakriti)</h3>
                  <p style={{fontSize: '1.3rem', margin: '0.5rem 0'}}>
                    <strong>{birthChart.health.constitution.type}</strong>
                  </p>
                  <p>{birthChart.health.constitution.description}</p>
                </div>
                
                <h3 className="section-title">Health Strengths</h3>
                {birthChart.health.strengths.map((s, i) => (
                  <div key={i} className="health-strength">✓ {s}</div>
                ))}
                
                <h3 className="section-title">Areas Requiring Attention</h3>
                {birthChart.health.weaknesses.map((w, i) => (
                  <div key={i} className="health-warning">⚠️ {w}</div>
                ))}
                
                {birthChart.health.vulnerableOrgans.length > 0 && (
                  <>
                    <h3 className="section-title">Vulnerable Organs/Systems</h3>
                    {birthChart.health.vulnerableOrgans.map((o, i) => (
                      <div key={i} className="health-warning">• {o}</div>
                    ))}
                  </>
                )}
                
                <h3 className="section-title">Recommended Pranayama</h3>
                <div className="analysis-grid">
                  {birthChart.health.recommendedPranayama.map((p, i) => (
                    <div key={i} className="analysis-card">
                      <h4 style={{color: 'var(--saffron)', marginBottom: '0.5rem'}}>
                        {p.practice}
                      </h4>
                      <p><strong>Benefit:</strong> {p.benefit}</p>
                      <p><strong>Duration:</strong> {p.duration}</p>
                    </div>
                  ))}
                </div>
                
                <h3 className="section-title">Dietary Recommendations</h3>
                <div className="info-box">
                  {birthChart.health.diet.map((d, i) => (
                    <div key={i} style={{padding: '0.3rem 0'}}>• {d}</div>
                  ))}
                </div>
              </div>
            </div>
          )}
          
          {activeTab === 'palmResults' && palmAnalysis && (
            <div className="card">
              <h2 className="section-title">Palm Analysis Results</h2>
              
              {palmImage && (
                <div style={{textAlign: 'center', marginBottom: '2rem'}}>
                  <img src={palmImage} className="palm-preview" alt="Palm" />
                </div>
              )}
              
              <div className="analysis-grid">
                <div className="analysis-card">
                  <h3>🏥 Health Analysis</h3>
                  <div style={{whiteSpace: 'pre-wrap', lineHeight: '1.8'}}>
                    {palmAnalysis.interpretation.health}
                  </div>
                </div>
                
                <div className="analysis-card">
                  <h3>👤 Personality</h3>
                  <div style={{whiteSpace: 'pre-wrap', lineHeight: '1.8'}}>
                    {palmAnalysis.interpretation.personality}
                  </div>
                </div>
                
                <div className="analysis-card">
                  <h3>💼 Career</h3>
                  <div style={{whiteSpace: 'pre-wrap', lineHeight: '1.8'}}>
                    {palmAnalysis.interpretation.career}
                  </div>
                </div>
                
                <div className="analysis-card">
                  <h3>🧘 Pranayama</h3>
                  <div style={{whiteSpace: 'pre-wrap', lineHeight: '1.8'}}>
                    {palmAnalysis.interpretation.pranayama}
                  </div>
                </div>
              </div>
              
              <h3 className="section-title">Complete Analysis</h3>
              <div className="info-box" style={{whiteSpace: 'pre-wrap'}}>
                {palmAnalysis.interpretation.fullAnalysis}
              </div>
            </div>
          )}
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CompleteAstrologyApp />);
  </script>
</body>
</html>
